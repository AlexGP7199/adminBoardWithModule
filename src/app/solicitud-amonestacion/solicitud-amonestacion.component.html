<div class="max-w-7xl mx-auto py-16 px-8 bg-white rounded-lg shadow-lg">
  <h1 class="text-3xl font-bold text-center text-gray-900 mb-8">Formulario de Amonestación</h1>

  <!-- Sección: Datos Generales -->
  <div class="bg-gray-50 p-6 rounded-lg shadow-md mb-8">
    <label class="block text-sm font-medium text-gray-700">Fecha de Reporte</label>
    <input type="date" [(ngModel)]="solicitudAmonestacion.fechaReporte" class="input mb-4" />

    <label class="block text-sm font-medium text-gray-700">Grado de Amonestación</label>
    <div class="flex gap-4">
      <label class="flex items-center">
        <input type="radio" [(ngModel)]="solicitudAmonestacion.gradoAmonestacion" value="Primer Grado" class="mr-2" /> Primer Grado
      </label>
      <label class="flex items-center">
        <input type="radio" [(ngModel)]="solicitudAmonestacion.gradoAmonestacion" value="Segundo Grado" class="mr-2" /> Segundo Grado
      </label>
      <label class="flex items-center">
        <input type="radio" [(ngModel)]="solicitudAmonestacion.gradoAmonestacion" value="Tercer Grado" class="mr-2" /> Tercer Grado
      </label>
    </div>
  </div>

  <!-- Sección: Datos del Servidor Público -->
  <div class="bg-gray-50 p-6 rounded-lg shadow-md mb-8">
    <h2 class="text-xl font-bold text-gray-700">Datos Generales</h2>

    <label class="block text-sm font-medium text-gray-700">Nombre Completo</label>
    <input type="text" [(ngModel)]="solicitudAmonestacion.nombreServidor" class="input mb-4" />

    <label class="block text-sm font-medium text-gray-700">Cédula</label>
    <input type="text" [(ngModel)]="solicitudAmonestacion.cedula" class="input mb-4" />

    <label class="block text-sm font-medium text-gray-700">Cargo</label>
    <mat-form-field appearance="outline" class="w-full">
      <mat-label>Seleccione un cargo</mat-label>
      <input matInput [formControl]="cargoControl" [matAutocomplete]="auto" />
      <mat-autocomplete #auto="matAutocomplete" (optionSelected)="seleccionarCargo($event)">
        <mat-option *ngFor="let cargo of filteredCargos | async" [value]="cargo">
          {{ cargo }}
        </mat-option>
      </mat-autocomplete>
    </mat-form-field>

    <label class="block text-sm font-medium text-gray-700">Dependencia</label>
    <input type="text" [(ngModel)]="solicitudAmonestacion.dependencia" class="input mb-4" />

    <label class="block text-sm font-medium text-gray-700">Contacto Telefónico</label>
    <input type="text" [(ngModel)]="solicitudAmonestacion.contacto" class="input mb-4" />
  </div>

  <!-- Sección: Datos del Reporte -->
  <div class="bg-gray-50 p-6 rounded-lg shadow-md mb-8">
    <h2 class="text-xl font-bold text-gray-700">Datos del Reporte</h2>
    <label class="block text-sm font-medium text-gray-700">Reportado por</label>
    <input type="text" [(ngModel)]="solicitudAmonestacion.reportadoPor" class="input mb-4" />

    <label class="block text-sm font-medium text-gray-700">Cargo</label>
    <input type="text" [(ngModel)]="solicitudAmonestacion.cargoReportado" class="input mb-4" />

    <label class="block text-sm font-medium text-gray-700">Fecha del Acontecimiento</label>
    <input type="date" [(ngModel)]="solicitudAmonestacion.fechaAcontecimiento" class="input mb-4" />

    <label class="block text-sm font-medium text-gray-700">Descripción del Hecho</label>
    <textarea [(ngModel)]="solicitudAmonestacion.descripcionHecho" class="input mb-4" rows="4"></textarea>
  </div>

  <!-- Botón de Envío -->
  <button (click)="enviarSolicitud()" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700 mt-4">
    Enviar Solicitud
  </button>
</div>
